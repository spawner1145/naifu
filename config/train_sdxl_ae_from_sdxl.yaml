# python trainer.py --config config/train_sdxl_ae_from_sdxl.yaml
name: sdxl-ae-from-sdxl
target: modules.train_sdxl.setup

trainer:
  model_path: "/root/autodl-tmp/naifu/checkpoint_sdxl_ae/checkpoint-e1_s1615.safetensors"

  batch_size: 10
  accumulate_grad_batches: 1

  seed: 1138
  wandb_id: "1145"
  use_xformers: false
  gradient_clip_val: 0.0

  # Debug：打印参数梯度与 step 后权重变化，确认确实在更新
  debug_param_update: true
  debug_param_update_every: 5

  save_format: safetensors
  checkpoint_dir: checkpoint_sdxl_ae
  checkpoint_freq: 1
  checkpoint_steps: -1
  save_weights_only: true
  max_epochs: 60
  max_steps: -1

advanced:
  vae_encode_batch_size: -1
  train_text_encoder_1: false
  train_text_encoder_2: false
  text_encoder_1_lr: 3e-6
  text_encoder_2_lr: 3e-6

  offset_noise: true
  offset_noise_val: 0.0375
  min_snr: true
  min_snr_val: 5
  timestep_start: 0
  timestep_end: 1000

  v_parameterization: false
  zero_terminal_snr: false
  do_edm_style_training: false

  use_flux_vae: true
  flux_vae_path: "/root/autodl-tmp/Pad Flux EQ v2 B1.safetensors"
  save_flux_vae: false
  flux_target_scale_factor: 0.3611

  flux_vae_params:
    resolution: 256
    in_channels: 3
    ch: 128
    out_ch: 3
    ch_mult: [1, 2, 4, 4]
    num_res_blocks: 2
    z_channels: 16
    scale_factor: 0.3611
    shift_factor: 0.1159

lightning:
  accelerator: gpu
  devices: 1
  precision: 32

dataset:
  name: data.bucket.AspectRatioDataset
  img_path: "/root/autodl-tmp/train/high/extracted_zip/1_img"

  target_area: 1_048_576
  min_size: 512
  max_size: 2048
  max_token_length: 225

optimizer:
  name: torch.optim.AdamW
  params: # 1.3e-5
    lr: 5e-5
    weight_decay: 1e-2

scheduler:
  name: transformers.get_constant_schedule_with_warmup
  params:
    num_warmup_steps: 0
    last_epoch: -1

sampling:
  enabled: true
  use_wandb: true
  seed: 1234
  height: 1024
  width: 1024
  every_n_steps: -1
  every_n_epochs: 1
  save_dir: samples
  prompts:
    - "best quality, 1girl"
